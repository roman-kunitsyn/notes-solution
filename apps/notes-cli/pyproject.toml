[project]
name = "notes-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "platformdirs>=4.11.5",
    "supabase>=2.31.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.5"]

[project.scripts]
notes = "notes_cli.cli:app"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: requires a running disposable Supabase stack",
]
