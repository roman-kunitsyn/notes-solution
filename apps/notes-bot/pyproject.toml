[project]
name = "notes-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roman Kunitsyn", email = "roman.kunitsyn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.23.0,<4",
]

[project.scripts]
notes-bot = "notes_bot.bot:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
