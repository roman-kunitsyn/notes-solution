<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Notes authentication code</title>
  </head>
  <body>
    <main>
      <h1>Your Notes authentication code</h1>

        Use this code to link your existing Notes account to the
        Telegram Notes bot:

      <p>
        If you did not request this code, you can ignore this email.
      </p>
    </main>
  </body>
</html>
