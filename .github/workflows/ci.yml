name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: |
          find deploy/self-hosted/scripts \
            -type f \
            -name '*.sh' \
            -exec sh -n {} +

      - name: Prepare non-secret production environment
        working-directory: deploy/self-hosted
        run: cp .env.production.example .env.production

      - name: Validate production Compose
        working-directory: deploy/self-hosted
        run: |
          docker compose \
            --env-file .env.production \
            --file docker-compose.yml \
            --file docker-compose.production.yml \
            --file docker-compose.caddy.yml \
            config --quiet

      - name: Ensure production environment remains ignored
        run: |
          git check-ignore \
            deploy/self-hosted/.env.production

      - name: Check repository formatting
        run: git diff --check

  database:
    name: Database migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Confirm CLI version
        run: |
          test "$(supabase --version)" = "2.115.0"

      - name: Start fresh Supabase database
        run: supabase db start

      - name: Run database tests
        run: supabase test db

      - name: Run database advisors
        run: supabase db advisors

      - name: Show migration status
        run: supabase migration list --local

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  notes-cli:
    name: Notes CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/notes-cli

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/notes-cli/uv.lock

      - name: Install Python
        run: uv python install

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Run lint checks
        run: uv run --frozen ruff check .

      - name: Run unit tests
        run: uv run --frozen pytest -m "not integration"

      - name: Verify CLI entry point
        run: uv run --frozen notes --help

      - name: Build package
        run: uv build

  notes-integration:
    name: Notes integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: apps/notes-cli

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/notes-cli/uv.lock

      - name: Install Python dependencies
        run: |
          uv python install
          uv sync --locked --all-groups

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Start disposable Supabase stack
        working-directory: .
        run: supabase start

      - name: Export disposable Supabase configuration
        working-directory: .
        run: |
          SUPABASE_STATUS="$(supabase status -o env)"

          API_URL="$(
            printf '%s\n' "$SUPABASE_STATUS" |
              sed -n 's/^API_URL=//p' |
              tr -d '"'
          )"

          ANON_KEY="$(
            printf '%s\n' "$SUPABASE_STATUS" |
              sed -n 's/^ANON_KEY=//p' |
              tr -d '"'
          )"

          printf 'SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$ANON_KEY" >> "$GITHUB_ENV"
          printf 'RUN_SUPABASE_INTEGRATION=1\n' >> "$GITHUB_ENV"

      - name: Run live integration tests
        run: uv run --frozen pytest -m integration

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: .
        run: supabase stop --no-backup
